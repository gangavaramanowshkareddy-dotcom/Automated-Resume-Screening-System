
services:

  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: resume_screening
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Local-only access for optional database tools; not exposed to the LAN.
    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_screening"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: resume_screening
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    # Persist uploaded resumes across backend container recreation.
    # main.py stores uploads under /app/uploads because WORKDIR is /app.
    volumes:
      - resume_uploads:/app/uploads


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://127.0.0.1:8000}"

    restart: unless-stopped

    ports:
      - "5174:80"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:
  resume_uploads:
